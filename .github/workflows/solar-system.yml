name: Solar-system application workflow

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/*"]

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install nodejs
        uses: actions/setup-node
        with:
          node_version: 18

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
